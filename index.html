<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UniHive</title>
    <meta name="description" content="UniHive — spletna stran prihaja kmalu." />
    <link rel="canonical" href="https://unihive.si/" />
    <meta name="theme-color" content="#2b2b2b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <!--
          Artboard: 2586×1844. Visible crop: 1920×1080 centered
          (offset left 333, top 382). Elements use artboard coordinates.
        -->
        <div class="artboard" id="artboard">
          <div class="bg-lettering" aria-hidden="true"></div>
          <div class="bg-texture" id="bg-texture-a" data-variant="1" aria-hidden="true"></div>
          <div class="bg-texture is-hidden" id="bg-texture-b" data-variant="2" aria-hidden="true"></div>

          <img class="corner corner-tl" src="assets/krog_1.svg" alt="" />
          <img class="corner corner-br" src="assets/krog_2.svg" alt="" />

          <!-- CTA sits under the right yellow banner; does not spin. -->
          <a
            class="prijavi-hit"
            id="prijavi-hit"
            href="https://forms.gle/LrB7eRt9eWpAZofQ8"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Prijavi se v monošolo zdaj!"
            tabindex="-1"
          >
            <img class="prijavi-banner" src="assets/prijavi_2026.svg" alt="" />
          </a>

          <div class="spin-root" id="spin-root">
            <div class="banners" id="banners">
              <div class="banner-track banner-track-left" id="banner-track-left">
                <img class="banner banner-left" id="banner-left" src="assets/banner_left.svg" alt="" />
                <img
                  class="banner-text banner-text-left"
                  id="text-left"
                  src="assets/spletna_stran.svg"
                  alt="spletna stran"
                />
              </div>
              <div class="banner-track banner-track-right" id="banner-track-right">
                <img class="banner banner-right" id="banner-right" src="assets/banner_right.svg" alt="" />
                <img
                  class="banner-text banner-text-right"
                  id="text-right"
                  src="assets/prihaja_kmalu.svg"
                  alt="Prihaja kmalu!"
                />
              </div>
            </div>
          </div>

          <button class="logo-hit" id="logo-hit" type="button" aria-label="UniHive" disabled>
            <img class="logo-shadow" src="assets/shadow_logo.svg" alt="" />
            <img class="logo" id="logo" src="assets/logo.svg" alt="UniHive" />
          </button>
        </div>
      </div>
    </div>

    <h1 class="visually-hidden">UniHive — spletna stran prihaja kmalu</h1>
    <script src="app.js" defer></script>
  </body>
</html>
