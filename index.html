<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UniHive</title>
    <meta name="description" content="UniHive — spletna stran prihaja kmalu." />
    <link rel="canonical" href="https://unihive.si/" />
    <meta name="theme-color" content="#2b2b2b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="scene" id="scene-normal" aria-hidden="false">
        <div class="bg-lettering"></div>
        <div class="bg-texture" id="bg-texture-a" data-variant="1"></div>
        <div class="bg-texture is-hidden" id="bg-texture-b" data-variant="2"></div>
        <img class="corner corner-tl yellow" src="assets/krog_1.svg" alt="" />
        <img class="corner corner-br yellow" src="assets/krog_2.svg" alt="" />
        <div class="spin-root" id="spin-root">
          <div class="banners" id="banners">
            <img class="banner banner-left yellow" src="assets/banner_left.svg" alt="" />
            <img class="banner banner-right yellow" src="assets/banner_right.svg" alt="" />
            <p class="banner-text banner-text-left" id="text-left">spletna stran</p>
            <p class="banner-text banner-text-right" id="text-right">Prihaja kmalu!</p>
          </div>
        </div>
        <button class="logo-hit" id="logo-hit" type="button" aria-label="UniHive" disabled>
          <img class="logo-shadow" src="assets/shadow_logo.svg" alt="" />
          <img class="logo yellow" id="logo" src="assets/logo.svg" alt="UniHive" />
        </button>
      </div>

      <div class="color-mask" id="color-mask" aria-hidden="true">
        <div class="scene scene-alt" id="scene-alt">
          <div class="bg-lettering"></div>
          <div class="bg-texture" data-variant="1"></div>
          <img class="corner corner-tl yellow" src="assets/krog_1.svg" alt="" />
          <img class="corner corner-br yellow" src="assets/krog_2.svg" alt="" />
          <div class="spin-root">
            <div class="banners">
              <img class="banner banner-left yellow" src="assets/banner_left.svg" alt="" />
              <img class="banner banner-right yellow" src="assets/banner_right.svg" alt="" />
              <p class="banner-text banner-text-left">spletna stran</p>
              <p class="banner-text banner-text-right">Prihaja kmalu!</p>
            </div>
          </div>
          <div class="logo-hit" aria-hidden="true">
            <img class="logo-shadow" src="assets/shadow_logo.svg" alt="" />
            <img class="logo yellow" src="assets/logo.svg" alt="" />
          </div>
        </div>
      </div>
    </div>

    <h1 class="visually-hidden">UniHive — spletna stran prihaja kmalu</h1>
    <script src="app.js" defer></script>
  </body>
</html>
