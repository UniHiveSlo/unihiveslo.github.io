<!DOCTYPE html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UniHive</title>
    <meta name="description" content="UniHive — prihaja kmalu." />
    <link rel="canonical" href="https://unihive.si/" />
    <link rel="icon" href="hero.png" type="image/png" />
    <link rel="apple-touch-icon" href="hero.png" />
    <link rel="preload" as="image" href="hero.png" />
    <meta name="theme-color" content="#2b2b2b" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:site_name" content="UniHive" />
    <meta property="og:title" content="UniHive" />
    <meta property="og:description" content="Prihaja kmalu!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://unihive.si/" />
    <meta property="og:image" content="https://unihive.si/hero.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1920" />
    <meta property="og:image:height" content="1080" />
    <meta property="og:locale" content="sl_SI" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="UniHive" />
    <meta name="twitter:description" content="Prihaja kmalu!" />
    <meta name="twitter:image" content="https://unihive.si/hero.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #2b2b2b;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        background: var(--bg);
      }

      .hero {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }

      /* Portrait phones are taller than the 16:9 artwork; contain keeps
         the logo and "PRIHAJA KMALU!" fully visible instead of cropping. */
      @media (max-aspect-ratio: 2/3) {
        .hero {
          object-fit: contain;
        }
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">UniHive — prihaja kmalu</h1>
      <img
        class="hero"
        src="hero.png"
        width="1920"
        height="1080"
        alt="UniHive — Prihaja kmalu!"
        decoding="async"
        fetchpriority="high"
      />
    </main>
  </body>
</html>
